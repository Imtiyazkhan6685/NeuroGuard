name: Build NeuroGuard Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd web-ui
          npm install --legacy-peer-deps

      - name: Ensure Standard Android JKS Keystore
        run: |
          cd web-ui/android/app
          if [ ! -f neuroguard.keystore ]; then
            keytool -genkeypair -v -keystore neuroguard.keystore -storetype JKS -alias neuroguard -keyalg RSA -keysize 2048 -validity 10000 -storepass neuroguard123 -keypass neuroguard123 -dname "CN=NeuroGuard,O=ScrollZero,C=US"
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x web-ui/android/gradlew

      - name: Build Android APK
        run: |
          cd web-ui/android
          ./gradlew assembleDebug --stacktrace

      - name: Locate & Copy APK
        run: |
          find web-ui/android/app/build/outputs/apk -name "*.apk" -exec cp {} NeuroGuard.apk \;
          ls -lh NeuroGuard.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroGuard-APK-v1.0.2
          path: NeuroGuard.apk
          retention-days: 14

      - name: Create or Update GitHub Release v1.0.2
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.2
          name: NeuroGuard v1.0.2 (Android APK)
          make_latest: true
          body: |
            ## 📱 NeuroGuard v1.0.2 Android Release
            
            ### Fixes & Enhancements:
            - **Fixed "Package appears to be invalid"**: Replaced unreleased Android 16 preview codenames (`compileSdkVersionCodename="16"`) with standard finalized Android 15 / Android 14 target APIs (`compileSdkVersion 35 (REL)`, `targetSdkVersion 34`). This allows all Android phones to parse and install the package cleanly.
            - **Updated Version**: Incremented to `versionCode 3`, `versionName 1.0.2`.
            - **Floating Corner Widget**: Real Instagram & YouTube Shorts tracking with edge-snapping and tap-to-dashboard.
            - **100% Play Protect Safe**: Zero sensitive SMS daemon permissions.
            - **Apple Fitness Interface**: Concentric Neon Tri-Rings & 7-Day Consistency Strip.
          files: NeuroGuard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Previous Release Links
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: NeuroGuard v1.0.1 (Android APK)
          files: NeuroGuard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
