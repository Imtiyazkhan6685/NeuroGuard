name: Build NeuroGuard Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd web-ui
          npm install --legacy-peer-deps

      - name: Grant Execute Permission to Gradlew
        run: chmod +x web-ui/android/gradlew

      - name: Build Android APK
        run: |
          cd web-ui/android
          ./gradlew assembleDebug --stacktrace

      - name: Locate & Copy APK
        run: |
          find web-ui/android/app/build/outputs/apk -name "*.apk" -exec cp {} NeuroGuard.apk \;
          ls -lh NeuroGuard.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroGuard-APK-v1.0.1
          path: NeuroGuard.apk
          retention-days: 14

      - name: Create or Update GitHub Release v1.0.1
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: NeuroGuard v1.0.1 (Android APK)
          make_latest: true
          body: |
            ## 📱 NeuroGuard v1.0.1 Android Release
            
            ### Fixes & Enhancements:
            - **Fixed "Package appears to be invalid"**: Re-aligned runtime targets to universal `targetSdkVersion 34` (Android 14) with `minSdkVersion 24`, and embedded a permanent deterministic keystore so updates install cleanly over previous installs.
            - **Updated Version**: Incremented to `versionCode 2`, `versionName 1.0.1`.
            - **Floating Corner Widget**: Real Instagram & YouTube Shorts tracking with edge-snapping and tap-to-dashboard.
            - **100% Play Protect Safe**: Zero sensitive SMS daemon permissions.
            - **Apple Fitness Interface**: Concentric Neon Tri-Rings & 7-Day Consistency Strip.
          files: NeuroGuard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Also Update Legacy v1.0.0 Asset
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: NeuroGuard v1.0.0 (Android APK)
          files: NeuroGuard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
